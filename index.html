```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .balance {
            background: #222;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 25px;
        }

        .balance h2 {
            font-size: 30px;
            margin-top: 10px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        h2 {
            margin-bottom: 15px;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f8f8;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 5px solid #007bff;
            border-radius: 5px;
        }

        .expense-info {
            display: flex;
            flex-direction: column;
        }

        .expense-name {
            font-weight: bold;
        }

        .expense-amount {
            color: #d9534f;
        }

        .delete-btn {
            background: #dc3545;
            padding: 7px 12px;
            font-size: 14px;
        }

        .delete-btn:hover {
            background: #a71d2a;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px;
            }

            li {
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>💰 Expense Tracker</h1>

        <div class="balance">
            <p>Total Expenses</p>
            <h2>₹<span id="total">0.00</span></h2>
        </div>

        <form id="expenseForm">

            <input
                type="text"
                id="expenseName"
                placeholder="Expense name"
                required
            >

            <input
                type="number"
                id="expenseAmount"
                placeholder="Amount"
                min="0"
                step="0.01"
                required
            >

            <button type="submit">Add Expense</button>

        </form>

        <h2>Expense History</h2>

        <ul id="expenseList">
            <li class="empty">No expenses added yet.</li>
        </ul>

    </div>

    <script>

        const expenseForm = document.getElementById("expenseForm");
        const expenseName = document.getElementById("expenseName");
        const expenseAmount = document.getElementById("expenseAmount");
        const expenseList = document.getElementById("expenseList");
        const total = document.getElementById("total");

        let expenses = [];

        // Add Expense
        expenseForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const name = expenseName.value.trim();
            const amount = Number(expenseAmount.value);

            if (name === "" || amount <= 0) {
                alert("Please enter a valid expense.");
                return;
            }

            const expense = {
                id: Date.now(),
                name: name,
                amount: amount
            };

            expenses.push(expense);

            expenseName.value = "";
            expenseAmount.value = "";

            displayExpenses();
        });


        // Display Expenses
        function displayExpenses() {

            expenseList.innerHTML = "";

            if (expenses.length === 0) {

                expenseList.innerHTML =
                    '<li class="empty">No expenses added yet.</li>';

                total.textContent = "0.00";

                return;
            }

            let totalAmount = 0;

            expenses.forEach(function(expense) {

                totalAmount += expense.amount;

                const li = document.createElement("li");

                li.innerHTML = `
                    <div class="expense-info">
                        <span class="expense-name">
                            ${expense.name}
                        </span>

                        <span class="expense-amount">
                            ₹${expense.amount.toFixed(2)}
                        </span>
                    </div>

                    <button
                        class="delete-btn"
                        onclick="deleteExpense(${expense.id})">
                        Delete
                    </button>
                `;

                expenseList.appendChild(li);
            });

            total.textContent = totalAmount.toFixed(2);
        }


        // Delete Expense
        function deleteExpense(id) {

            expenses = expenses.filter(function(expense) {
                return expense.id !== id;
            });

            displayExpenses();
        }

    </script>

</body>
</html>
